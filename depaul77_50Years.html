const intro=(t,q,names,st)=>`<div class="page intro"><div class="orn">✦ ✦ ✦</div><h1>${t}</h1><div class="orn">✦ ✦ ✦</div><p class="q">${q}</p><select class="jump" onchange="if(this.value!=='')jumpTo(+this.value)"><option value="">Jump to a person…</option>${names.map((x,i)=>`<option value="${st+i}">${x}</option>`).join('')}</select><p class="hint">Tap Next to begin →</p></div>`;
function jumpTo(i){cur=i;show()}
pages.push(`<div class="page intro reun"><div class="orn">✦ ✦ ✦</div><h1>DePaul Class of 1977: 50th Reunion Celebration</h1><div class="orn">✦ ✦ ✦</div><p class="q">Can you believe it's been 50 years?<br>Half a century later, it’s time to look back, catch up, and celebrate the incredible journeys we've all taken.</p><p class="q">🥰 Let us know if you can make it by completing this quick form.<br>Don't let the memories fade—let's make some new ones!</p><p class="q"><a class="rlink" href="https://forms.gle/VTfZwPtVurUsmd819" target="_blank" rel="noopener">&#128073; Click here</a></p></div>`);
const c1=pages.length;
pages.push(intro('Classmates','Here’s to the friends of 1977 - nearly fifty years on, the shared stories, lifelong friendships, and spirit of our batch remain as bright as ever.',P.map(p=>p[0]),c1+1));
P.forEach((p,i)=>{const [n,o,r,t,l]=p;
const c=t?`<div class="btns"><a class="call" href="tel:+${t}">&#128222; Call</a><a class="wa" href="https://wa.me/${t}" target="_blank" rel="noopener">WhatsApp</a></div><div class="num">+${t}</div>`:`<div class="nocon">Contact number not available</div>`;
pages.push(`<div class="page"><div class="tag">Now · Reimagined</div>${img(r,'',n+' reimagined')}<h2>${n}</h2><div class="orn">✦ ✦ ✦</div><div class="line">${l}</div><div class="tag">Then · School days</div>${img(o,'old',n)}${c}<a class="mem" href="https://forms.gle/CQ9WDdWhY7b2NAyP8" target="_blank" rel="noopener">&#128221; Have a favorite memory of ${n}? Share it in the Class of 77 Memory Bank—it’ll surely bring a smile to ${n.split(' ')[0]}’s face! <span class="clk">&#128073; Click here</span></a><div class="pn">${i+1} / ${P.length}</div></div>`)});
const c2=pages.length;
pages.push(intro('Teachers and Staff','In loving gratitude to our teachers and staff ; you planted the seeds of who we are today, and your legacy lives on in every life you touched.',S.map(p=>p[0]),c2+1));
S.forEach((p,i)=>{const [n,o,l]=p;
pages.push(`<div class="page"><div class="tag">With gratitude</div><h2>${n}</h2><div class="orn">✦ ✦ ✦</div>${img(o,'old',n)}<div class="line">${l}</div><a class="mem" href="https://forms.gle/rujHZ5WwBoVF2jvc7" target="_blank" rel="noopener">&#128221; Remember a lesson, moment, or word of encouragement from ${n}? Share it in the Class of 77 Memory Bank and keep their legacy alive. <span class="clk">&#128073; Click here</span></a><div class="pn">${i+1} / ${S.length}</div></div>`)});
pages.push(`<div class="page end"><h1>Until we meet again</h1><div class="orn">✦ ✦ ✦</div><p class="line">Fifty years of friendship, memories and laughter.<br>De Paul Class of 77 · 1977 – 2027</p></div>`);
book.innerHTML=pages.join('');
const els=[...book.children];let cur=0;const m1=document.getElementById('m1'),m2=document.getElementById('m2');
function show(){els.forEach((e,i)=>{e.classList.toggle('show',i===cur||i===cur-1&&e.classList.contains('flip'));e.classList.toggle('flip',i<cur);e.style.zIndex=i<cur?i:els.length-i;e.style.display=(i>=cur-1&&i<=cur)?'block':'none'});els[cur].scrollTop=0;
document.getElementById('pos').textContent=cur===0?'Cover':cur===1?'Reunion':cur===els.length-1?'End':cur<c2?'Classmates':'Teachers & Staff';m1.classList.toggle('on',cur>=c1&&cur<c2);m2.classList.toggle('on',cur>=c2&&cur<els.length-1);
document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===els.length-1;location.hash=cur}
function go(d){const n=cur+d;if(n<0||n>=els.length)return;cur=n;show()}
m1.onclick=e=>{e.preventDefault();cur=c1;show()};m2.onclick=e=>{e.preventDefault();cur=c2;show()};
document.getElementById('next').onclick=()=>go(1);document.getElementById('prev').onclick=()=>go(-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
let x0=null;book.addEventListener('touchstart',e=>x0=e.touches[0].clientX);
book.addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>60)go(d<0?1:-1);x0=null});
const h=parseInt(location.hash.slice(1));if(h>0&&h<els.length)cur=h;show();
</script></body></html>
