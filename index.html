<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Half a Century Later – De Paul Class of 77</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#10264a;--gold:#c9a24a;--paper:#fbf6ea;--ink:#2a2a2a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 30%,#2b3f66,#0a1428);font-family:'Playfair Display',Georgia,serif;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
#book{position:relative;width:min(94vw,440px);height:min(80vh,720px);perspective:1800px}
.page{position:absolute;inset:0;background:var(--paper);border-radius:6px 14px 14px 6px;box-shadow:0 20px 50px rgba(0,0,0,.55),inset 8px 0 14px rgba(0,0,0,.12);transform-origin:left center;transition:transform .8s cubic-bezier(.65,.05,.3,1),opacity .3s .5s;overflow-y:auto;display:none;text-align:center;padding:22px 22px 28px;border-left:6px solid var(--navy)}
.page.show{display:block}.page.flip{transform:rotateY(-110deg);opacity:0;pointer-events:none}
.page.cover{padding:0;background:#0a1428;border:0;overflow:hidden}.cover img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;background:#0a1428}
.ph{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.25);background:#e8e0cb}
.tag{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:#8a7a52;margin:10px 0 6px}
.old{filter:sepia(.25)}
h2{font-family:'Great Vibes',cursive;font-size:2.9rem;font-weight:400;color:var(--navy);margin:8px 0 2px;line-height:1.1}
.orn{color:var(--gold);letter-spacing:.4em;font-size:.9rem}
.line{font-style:italic;color:#4a4a4a;margin:8px 6px 16px;line-height:1.5}
.btns{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.btns a{padding:10px 18px;border-radius:30px;text-decoration:none;color:#fff;font-size:.9rem;font-weight:700}
.call{background:var(--navy)}.wa{background:#1f9d55}.nocon{color:#999;font-size:.85rem}
.num{color:#666;font-size:.85rem;margin-top:10px}
.mem{display:block;margin:18px 6px 8px;padding:11px 14px;border:1.5px dashed var(--gold);border-radius:12px;color:var(--navy);text-decoration:none;font-size:.8rem;font-weight:400;background:#fff8e1}
.clk{color:#1a56db;white-space:nowrap}
.pn{position:absolute;bottom:8px;right:16px;font-size:.7rem;color:#9a8c6a}
.end h1{font-family:'Great Vibes',cursive;font-size:3rem;color:var(--navy);margin-top:30%}
#menu{display:flex;gap:14px;align-items:center;margin-bottom:12px;color:#8a7a52;font-size:.95rem}
#menu a{color:#e9dfc2;text-decoration:none;padding:6px 14px;border-radius:30px;font-weight:700}
#menu a.on{background:var(--gold);color:var(--navy)}
.intro{display:none;padding-top:22%}.intro.show{display:block}
.intro h1{font-family:'Great Vibes',cursive;font-size:3.2rem;font-weight:400;color:var(--navy);margin:14px 0}
.intro .q{font-style:italic;color:#4a4a4a;line-height:1.7;margin:18px 8px;font-size:1.05rem}
.jump{width:90%;max-width:320px;padding:10px;border-radius:10px;border:1px solid var(--gold);background:#fff;font-family:inherit;font-size:.95rem;color:var(--navy);margin-top:6px}
.reun{padding-top:10%}.reun h1{font-family:'Playfair Display',Georgia,serif;font-size:1.6rem;line-height:1.3;font-weight:700}
.rlink{display:inline-block;padding:11px 22px;border-radius:30px;background:var(--navy);color:#fff;text-decoration:none;font-weight:700}
.intro .hint{color:#9a8c6a;font-size:.8rem;margin-top:30px}
#nav{margin-top:14px;display:flex;gap:14px;align-items:center;color:#e9dfc2;font-size:.85rem}
#nav button{background:var(--gold);border:0;border-radius:30px;padding:9px 20px;font-family:inherit;font-weight:700;color:var(--navy);cursor:pointer}
#nav button:disabled{opacity:.4}
.loading{color:#e9dfc2;text-align:center;margin-top:45%;font-style:italic}
</style></head><body>
<div id="menu"><a href="#" id="m1">Classmates</a><span>|</span><a href="#" id="m2">Teachers and Staff</a></div>
<div id="book"><div class="loading">Opening album...</div></div>
<div id="nav"><button id="prev">&#8592; Prev</button><span id="pos"></span><button id="next">Next &#8594;</button></div>

<script>
const COVER="https://drive.google.com/thumbnail?id=1iDiVm9Lj1wzxGfM31Ywuu6it_I1ZMnlZ&sz=w1200";
const book=document.getElementById('book');
let cur=0, els=[], c1=0, c2=0;

function jumpTo(i){cur=i;show()}

function show(){
  els.forEach((e,i)=>{
    e.classList.toggle('show',i===cur||i===cur-1&&e.classList.contains('flip'));
    e.classList.toggle('flip',i<cur);
    e.style.zIndex=i<cur?i:els.length-i;
    e.style.display=(i>=cur-1&&i<=cur)?'block':'none';
  });
  els[cur].scrollTop=0;
  document.getElementById('pos').textContent=cur===0?'Cover':cur===1?'Reunion':cur===els.length-1?'End':cur<c2?'Classmates':'Teachers & Staff';
  document.getElementById('m1').classList.toggle('on',cur>=c1&&cur<c2);
  document.getElementById('m2').classList.toggle('on',cur>=c2&&cur<els.length-1);
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===els.length-1;
  location.hash=cur;
}

function go(d){const n=cur+d;if(n<0||n>=els.length)return;cur=n;show()}

async function init(){
  try {
    const v = Date.now(); // Prevents GitHub Pages browser caching when you update txt files
    const [pRes, sRes] = await Promise.all([
      fetch(`p.txt?v=${v}`),
      fetch(`s.txt?v=${v}`)
    ]);
    if(!pRes.ok || !sRes.ok) throw new Error("Failed to load data files");
    const P = await pRes.json();
    const S = await sRes.json();

    const img=(id,cls,alt)=>`<img class="ph ${cls}" loading="lazy" alt="${alt}" src="https://drive.google.com/thumbnail?id=${id}&sz=w800" onerror="this.onerror=null;this.src='https://drive.google.com/uc?id=${id}'">`;
    const pages=[`<div class="page cover"><img src="${COVER}" onerror="this.onerror=null;this.src='https://drive.google.com/uc?id=1iDiVm9Lj1wzxGfM31Ywuu6it_I1ZMnlZ'" alt="Half a Century Later – De Paul Class of 77"></div>`];
    const intro=(t,q,names,st)=>`<div class="page intro"><div class="orn">✦ ✦ ✦</div><h1>${t}</h1><div class="orn">✦ ✦ ✦</div><p class="q">${q}</p><select class="jump" onchange="if(this.value!=='')jumpTo(+this.value)"><option value="">Jump to a person…</option>${names.map((x,i)=>`<option value="${st+i}">${x}</option>`).join('')}</select><p class="hint">Tap Next to begin →</p></div>`;

    pages.push(`<div class="page intro reun"><div class="orn">✦ ✦ ✦</div><h1>DePaul Class of 1977: 50th Reunion Celebration</h1><div class="orn">✦ ✦ ✦</div><p class="q">Can you believe it's been 50 years?<br>Half a century later, it’s time to look back, catch up, and celebrate the incredible journeys we've all taken.</p><p class="q">🥰 Let us know if you can make it by completing this quick form.<br>Don't let the memories fade—let's make some new ones!</p><p class="q"><a class="rlink" href="https://forms.gle/VTfZwPtVurUsmd819" target="_blank" rel="noopener">&#128073; Click here</a></p></div>`);

    c1=pages.length;
    pages.push(intro('Classmates','Here’s to the friends of 1977 - nearly fifty years on, the shared stories, lifelong friendships, and spirit of our batch remain as bright as ever.',P.map(p=>p[0]),c1+1));

    P.forEach((p,i)=>{
      const [n,o,r,t,l]=p;
      const c=t?`<div class="btns"><a class="call" href="tel:+${t}">&#128222; Call</a><a class="wa" href="https://wa.me/${t}" target="_blank" rel="noopener">WhatsApp</a></div><div class="num">+${t}</div>`:`<div class="nocon">Contact number not available</div>`;
      pages.push(`<div class="page"><div class="tag">Reimagined photo</div>${img(r,'',n+' reimagined')}<h2>${n}</h2><div class="orn">✦ ✦ ✦</div><div class="line">${l}</div><div class="tag">Then · School days</div>${img(o,'old',n)}${c}<a class="mem" href="https://forms.gle/CQ9WDdWhY7b2NAyP8" target="_blank" rel="noopener">&#128221; Have a favorite memory of ${n}? Share it in the Class of 77 Memory Bank—it’ll surely bring a smile to ${n.split(' ')[0]}’s face! <span class="clk">&#128073; Click here</span></a><div class="pn">${i+1} / ${P.length}</div></div>`);
    });

    c2=pages.length;
    pages.push(intro('Teachers and Staff','In loving gratitude to our teachers and staff ; you planted the seeds of who we are today, and your legacy lives on in every life you touched.',S.map(p=>p[0]),c2+1));

    S.forEach((p,i)=>{
      const [n,o,l]=p;
      pages.push(`<div class="page"><div class="tag">With gratitude</div><h2>${n}</h2><div class="orn">✦ ✦ ✦</div>${img(o,'old',n)}<div class="line">${l}</div><a class="mem" href="https://forms.gle/rujHZ5WwBoVF2jvc7" target="_blank" rel="noopener">&#128221; Remember a lesson, moment, or word of encouragement from ${n}? Share it in the Class of 77 Memory Bank and keep their legacy alive. <span class="clk">&#128073; Click here</span></a><div class="pn">${i+1} / ${S.length}</div></div>`);
    });

    pages.push(`<div class="page end"><h1>Until we meet again</h1><div class="orn">✦ ✦ ✦</div><p class="line">Fifty years of friendship, memories and laughter.<br>De Paul Class of 77 · 1977 – 2027</p></div>`);

    book.innerHTML=pages.join('');
    els=[...book.children];

    document.getElementById('m1').onclick=e=>{e.preventDefault();cur=c1;show()};
    document.getElementById('m2').onclick=e=>{e.preventDefault();cur=c2;show()};
    document.getElementById('next').onclick=()=>go(1);
    document.getElementById('prev').onclick=()=>go(-1);
    document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});

    let x0=null;
    book.addEventListener('touchstart',e=>x0=e.touches[0].clientX);
    book.addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>60)go(d<0?1:-1);x0=null});

    const h=parseInt(location.hash.slice(1));
    if(h>0&&h<els.length)cur=h;
    show();
  } catch (err) {
    book.innerHTML=`<div class="loading">Error loading data. Check p.txt and s.txt formatting.</div>`;
    console.error(err);
  }
}

init();
</script></body></html>
